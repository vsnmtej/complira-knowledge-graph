name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-xdist

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov=complira_graph \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow" \
            --maxfail=5
        continue-on-error: false

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-tests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      # ArangoDB for graph database tests
      arangodb:
        image: arangodb:3.11
        env:
          ARANGO_ROOT_PASSWORD: test
        ports:
          - 8529:8529
        options: >-
          --health-cmd "curl -f http://localhost:8529/_api/version || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for cache tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Wait for services
        run: |
          timeout 30 sh -c 'until curl -f http://localhost:8529/_api/version; do sleep 1; done'
          timeout 30 sh -c 'until redis-cli ping; do sleep 1; done'

      - name: Run integration tests
        env:
          ARANGO_HOST: localhost
          ARANGO_PORT: 8529
          ARANGO_USER: root
          ARANGO_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/integration/ -v \
            --cov=src \
            --cov=complira_graph \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "integration and not slow" \
            --maxfail=3
        continue-on-error: false

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-tests

  parser-tests:
    name: Parser Tests (CycloneDX, SARIF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run verification script
        run: |
          python test_scan_fixes.py
        continue-on-error: false

      - name: Test CycloneDX parser with real data
        run: |
          python -c "
          import json
          from pathlib import Path
          from src.api.parsers.cyclonedx import CycloneDXParser

          # Load FDA SBOM fixture
          sbom_file = Path('tests/fixtures/sboms/fda_sbom.json')
          if not sbom_file.exists():
              print('⚠️  FDA SBOM fixture not found, skipping')
              exit(0)

          with open(sbom_file) as f:
              sbom = json.load(f)

          # Parse SBOM
          parser = CycloneDXParser()
          result = parser.parse(sbom)

          # Verify results
          assert len(result.components) == 59, f'Expected 59 components, got {len(result.components)}'
          assert len(result.findings) == 78, f'Expected 78 findings, got {len(result.findings)}'

          # Count vulnerability types
          cve_count = sum(1 for f in result.findings if f.cve_id and f.cve_id.startswith('CVE-'))
          ghsa_count = sum(1 for f in result.findings if f.cve_id and f.cve_id.startswith('GHSA-'))

          assert cve_count == 73, f'Expected 73 CVE vulnerabilities, got {cve_count}'
          assert ghsa_count == 5, f'Expected 5 GHSA vulnerabilities, got {ghsa_count}'

          print('✅ CycloneDX parser test passed')
          print(f'   Components: {len(result.components)}')
          print(f'   CVE: {cve_count}, GHSA: {ghsa_count}')
          "

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff linter
        run: |
          ruff check src/ tests/
        continue-on-error: true

      - name: Run type checker
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests (vitest + Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Run unit tests (vitest)
        run: cd frontend && npm run test

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: cd frontend && npm run test:e2e
        env:
          NEXTAUTH_SECRET: ci_test_secret_32_characters_long

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t complira-api:test .

      - name: Build frontend image
        run: docker build -t complira-frontend:test ./frontend

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, parser-tests, frontend-tests, docker-build]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          echo "Parser tests: ${{ needs.parser-tests.result }}"
          echo "Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "Docker build: ${{ needs.docker-build.result }}"

          FAILED=0
          for job in unit-tests integration-tests parser-tests frontend-tests docker-build; do
            result="${{ needs[job].result }}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "❌ $job failed"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

          echo "✅ All tests passed!"
