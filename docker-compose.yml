services:
  # ========== ArangoDB Database ==========
  arangodb:
    image: arangodb:3.12
    container_name: complira-arangodb
    restart: unless-stopped
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-CompliraSecurePassword123!}
      ARANGO_STORAGE_ENGINE: rocksdb
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
    networks:
      - complira-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Performance tuning
    command: >
      --server.statistics true
      --foxx.queues true
      --rocksdb.block-cache-size 2147483648
      --javascript.app-path /var/lib/arangodb3-apps

  # ========== Redis Cache ==========
  redis:
    image: redis:7-alpine
    container_name: complira-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - complira-network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Prefect Server ==========
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: complira-prefect-server
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://0.0.0.0:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////var/lib/prefect/prefect.db
    volumes:
      - prefect_data:/var/lib/prefect
    networks:
      - complira-network
    command: prefect server start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========== Prometheus Metrics ==========
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: complira-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"  # External port 9091 to avoid conflicts
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - complira-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== Grafana Dashboards ==========
  grafana:
    image: grafana/grafana:10.2.2
    container_name: complira-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - complira-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ========== Networks ==========
networks:
  complira-network:
    driver: bridge
    name: complira-network

# ========== Volumes ==========
volumes:
  arangodb_data:
    name: complira-arangodb-data
    driver: local
  arangodb_apps:
    name: complira-arangodb-apps
    driver: local
  redis_data:
    name: complira-redis-data
    driver: local
  prefect_data:
    name: complira-prefect-data
    driver: local
  prometheus_data:
    name: complira-prometheus-data
    driver: local
  grafana_data:
    name: complira-grafana-data
    driver: local
